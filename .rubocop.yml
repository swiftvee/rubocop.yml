require:
<% (Dir["./rubocop/cops/custom/**/*.rb"] + Dir["./rubocop/rubocop/cops/custom/**/*.rb"]).sort.each do |path| %>
  - <%= path %>
<% end %>

plugins:
  - rubocop-capybara
  - rubocop-factory_bot
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails

inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  Exclude:
    - 'rubocop/**/*'

Layout/FirstArrayElementLineBreak:
  Enabled: true

Layout/FirstHashElementLineBreak:
  Enabled: true

Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/FirstMethodParameterLineBreak:
  Enabled: true

Layout/LineLength:
  Max: 140

Layout/MultilineArrayLineBreaks:
  Enabled: true

Layout/MultilineHashKeyLineBreaks:
  Enabled: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true

# https://docs.rubocop.org/rubocop/cops_metrics.html#metricsabcsize
Metrics/AbcSize:
  Max: 30

# https://docs.rubocop.org/rubocop/cops_metrics.html#metricsblocklength
Metrics/BlockLength:
  AllowedMethods:
  - class_methods
  - included
  Exclude:
  - 'config/**/*'

Metrics/ClassLength:
  Max: 200

# https://docs.rubocop.org/rubocop/cops_metrics.html#metricsmethodlength
Metrics/MethodLength:
  Max: 25

Metrics/ModuleLength:
  Max: 200

# Keyword arguments carry their name at the call site, so a long keyword list does not have
# the ordering and readability problems the cop counts parameters to catch.
Metrics/ParameterLists:
  Max: 7
  CountKeywordArgs: false

# `bg` is Bootstrap's own vocabulary and `og` is the OpenGraph prefix, the same kind of domain
# abbreviation as the `db`/`io`/`ip`/`os` the cop ships with. The merge appends to that list,
# so a name RuboCop adds later still arrives.
Naming/MethodParameterName:
  inherit_mode:
    merge:
      - AllowedNames
  AllowedNames:
    - bg
    - og

# https://docs.rubocop.org/rubocop-rails/cops_rails.html#railsi18nlocaletexts
Rails/I18nLocaleTexts:
  Enabled: false

Rails/LinkToBlank:
  Enabled: false

# https://docs.rubocop.org/rubocop-rails/cops_rails.html#railstimezone
# The default `flexible` style accepts `Time.now.utc`, which reads as deliberate but still
# takes its date from UTC, so a value built from it lands on the previous day for the first
# two hours of every SAST day. `strict` accepts only a `Time.zone` source.
Rails/TimeZone:
  EnforcedStyle: strict

# `config/environments/staging.rb` is the fourth environment; naming it lets the cop keep
# catching a misspelled one everywhere else.
Rails/UnknownEnv:
  inherit_mode:
    merge:
      - Environments
  Environments:
    - staging

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecdescribeclass
RSpec/DescribeClass:
  Exclude:
    - 'spec/{requests,system}/**/*'

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecexamplelength
RSpec/ExampleLength:
  Max: 25

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecimplicitsubject
RSpec/ImplicitSubject:
  EnforcedStyle: single_statement_only

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecmultipleexpectations
RSpec/MultipleExpectations:
  Exclude:
  - 'spec/{requests,system}/**/*'

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecmultiplememoizedhelpers
RSpec/MultipleMemoizedHelpers:
  Max: 20

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecnestedgroups
RSpec/NestedGroups:
  Max: 7

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecpending
RSpec/Pending:
  Enabled: true

# https://docs.rubocop.org/rubocop/cops_style.html#styledocumentation
Style/Documentation:
  Enabled: false

# https://docs.rubocop.org/rubocop/cops_style.html#stylefetchenvvar
Style/FetchEnvVar:
  Enabled: false

# https://docs.rubocop.org/rubocop/cops_style.html#stylefrozenstringliteralcomment
Style/FrozenStringLiteralComment:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: always

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
