require:
<% (Dir["./rubocop/cops/custom/**/*.rb"] + Dir["./rubocop/rubocop/cops/custom/**/*.rb"]).sort.each do |path| %>
  - <%= path %>
<% end %>

plugins:
  - rubocop-capybara
  - rubocop-factory_bot
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails

inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  Exclude:
    - 'rubocop/**/*'

Bundler/GemComment:
  Enabled: true

Layout/FirstArrayElementLineBreak:
  Enabled: true

Layout/FirstHashElementLineBreak:
  Enabled: true

Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/FirstMethodParameterLineBreak:
  Enabled: true

Layout/HeredocArgumentClosingParenthesis:
  Enabled: true

Layout/LineLength:
  Max: 140

Layout/MultilineArrayLineBreaks:
  Enabled: true

Layout/MultilineHashKeyLineBreaks:
  Enabled: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true

Lint/HeredocMethodCallPosition:
  Enabled: true

Lint/ShadowingOuterLocalVariable:
  Enabled: true

Lint/UnusedPrivateMethod:
  Enabled: true

# https://docs.rubocop.org/rubocop/cops_metrics.html#metricsabcsize
Metrics/AbcSize:
  Max: 30

# https://docs.rubocop.org/rubocop/cops_metrics.html#metricsblocklength
Metrics/BlockLength:
  AllowedMethods:
  - class_methods
  - included
  Exclude:
  - 'config/**/*'

Metrics/ClassLength:
  Max: 200

# https://docs.rubocop.org/rubocop/cops_metrics.html#metricsmethodlength
Metrics/MethodLength:
  Max: 25

Metrics/ModuleLength:
  Max: 200

Metrics/ParameterLists:
  Max: 7

Naming/InclusiveLanguage:
  Enabled: true

# https://docs.rubocop.org/rubocop-rails/cops_rails.html#railsi18nlocaletexts
Rails/I18nLocaleTexts:
  Enabled: false

Rails/LinkToBlank:
  Enabled: false

Rails/RequireDependency:
  Enabled: true

Rails/TableNameAssignment:
  Enabled: true

Rails/UnusedIgnoredColumns:
  Enabled: true

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecdescribeclass
RSpec/DescribeClass:
  Exclude:
    - 'spec/{requests,system}/**/*'

RSpec/DescribedClassModuleWrapping:
  Enabled: true

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecexamplelength
RSpec/ExampleLength:
  Max: 25

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecimplicitsubject
RSpec/ImplicitSubject:
  EnforcedStyle: single_statement_only

RSpec/MessageExpectation:
  Enabled: true

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecmultipleexpectations
RSpec/MultipleExpectations:
  Exclude:
  - 'spec/{requests,system}/**/*'

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecmultiplememoizedhelpers
RSpec/MultipleMemoizedHelpers:
  Max: 20

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecnestedgroups
RSpec/NestedGroups:
  Max: 7

# https://docs.rubocop.org/rubocop-rspec/cops_rspec.html#rspecpending
RSpec/Pending:
  Enabled: true

Style/ArrayCoercion:
  Enabled: true

Style/AutoResourceCleanup:
  Enabled: true

# https://docs.rubocop.org/rubocop/cops_style.html#styledocumentation
Style/Documentation:
  Enabled: false

# https://docs.rubocop.org/rubocop/cops_style.html#stylefetchenvvar
Style/FetchEnvVar:
  Enabled: false

# https://docs.rubocop.org/rubocop/cops_style.html#stylefrozenstringliteralcomment
Style/FrozenStringLiteralComment:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: always

Style/RedundantStructKeywordInit:
  Enabled: true

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/StringMethods:
  Enabled: true

Style/TopLevelMethodDefinition:
  Enabled: true

Style/TrailingCommaInBlockArgs:
  Enabled: true
